name: E2E

on:
  workflow_dispatch:
    inputs:
      cbuild2cmake_ref:
        description: 'Branch, tag, or commit of Open-CMSIS-Pack/cbuild2cmake to build'
        type: string
        default: refs/heads/apply-preprocessor-options-during
  push:
    branches: [ main ]
  pull_request:
    paths:
      - '.github/workflows/e2e.yml'
      - '.github/workflows/shared-e2e.yml'
      - '.github/matrix_includes.json'
      - 'debian/**'
      - 'test/e2e/**'
      - 'test/vcpkg-configuration.json'
      - '!**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  e2e:
    uses: ./.github/workflows/shared-e2e.yml
    with:
      retention-days: 1
      cbuild2cmake_ref: ${{ inputs.cbuild2cmake_ref || 'refs/heads/apply-preprocessor-options-during' }}
