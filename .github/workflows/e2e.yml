name: E2E

on:
  workflow_dispatch:
    inputs:
      buildmgr_repository:
        description: 'Repository containing the buildmgr release (for example brondani/devtools)'
        type: string
        default: Open-CMSIS-Pack/devtools
      buildmgr_release:
        description: 'Buildmgr release tag (for example tools/buildmgr/2.12.0-dev0); blank uses nightly artifacts'
        type: string
        default: ''
  push:
    branches: [ main ]
  pull_request:
    paths:
      - '.github/workflows/e2e.yml'
      - '.github/workflows/shared-e2e.yml'
      - '.github/matrix_includes.json'
      - 'debian/**'
      - 'test/e2e/**'
      - 'test/vcpkg-configuration.json'
      - '!**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  e2e:
    uses: ./.github/workflows/shared-e2e.yml
    with:
      retention-days: 1
      buildmgr_repository: ${{ inputs.buildmgr_repository || 'Open-CMSIS-Pack/devtools' }}
      buildmgr_release: ${{ inputs.buildmgr_release || '' }}
